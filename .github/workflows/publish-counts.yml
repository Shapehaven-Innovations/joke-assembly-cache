name: publish-counts
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  # contents: write is needed only by the daily history snapshot step at the end. Its one small commit a day also keeps the
  # repository active, so GitHub never disables the schedule under the 60-day rule.
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url || steps.deploy_last.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The token is not left in .git/config: only the snapshot step below receives it.
          persist-credentials: false
          # The branch tip, not the commit GitHub pinned when the run was created: a scheduled run can start hours late.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Export counts from the Worker
        id: export
        env:
          EXPORT_KEY: ${{ secrets.EXPORT_KEY }}
          EXPORT_URL: ${{ vars.EXPORT_URL }}
        run: |
          curl --fail --silent --show-error --proto '=https' --max-time 30 --retry 2 -H "X-Export-Key: $EXPORT_KEY" "$EXPORT_URL" -o export.json
      - name: Build counts.json
        run: node scripts/build-counts.mjs export.json public/counts.json
      - name: Build top.json (never blocks counts)
        run: node scripts/build-top.mjs public/counts.json history public/top.json || echo "::warning::top.json was not built"
      # Reads only data/samples.json and the clock: no secrets, no export, no network. A failure never blocks counts.json.
      - name: Build AI-readable files (never blocks counts)
        run: node scripts/build-ai-files.mjs data/samples.json public || echo "::warning::AI files were not built"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      # GitHub can list no artifact for several seconds after the upload has finalized it, and deploy-pages looks only once
      # ("No artifacts named github-pages were found", actions/deploy-pages#451). Retry the deploy inside this job: re-running
      # the job uploads a second artifact with the same name, and the deploy then fails with "Multiple artifacts".
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy_retry.outcome == 'failure'
        run: sleep 60
      - id: deploy_last
        if: steps.deploy_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
      # After the deploy on purpose: a failed push never delays counts.json or top.json. Pushes made with GITHUB_TOKEN start no
      # new workflow run, and only public/ is published, so history/ is never served.
      - name: Daily history snapshot (one commit a UTC day)
        if: ${{ !github.event.repository.fork }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # The script syncs to the remote tip before deciding, and retries a lost push race (see its header comment).
        run: bash scripts/publish-snapshot.sh public/counts.json history
      # Last on purpose: the counts are already published. A failed run is how the owner is told (GitHub emails failed runs;
      # the Workers Free plan has no usage notifications). The usage numbers are never written to counts.json or top.json.
      - name: Fail the run when Worker usage is over 70% of its daily limits
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: node scripts/check-usage.mjs export.json
