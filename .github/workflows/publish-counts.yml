name: publish-counts
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  # contents: write is needed only by the keepalive step at the end, which pushes an
  # empty commit so GitHub does not disable the schedule after 60 days of repo inactivity.
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Export counts from the Worker
        env:
          EXPORT_KEY: ${{ secrets.EXPORT_KEY }}
          EXPORT_URL: ${{ vars.EXPORT_URL }}
        run: |
          curl --fail --silent --show-error --proto '=https' --max-time 30 --retry 2 -H "X-Export-Key: $EXPORT_KEY" "$EXPORT_URL" -o export.json
      - name: Build counts.json
        run: node scripts/build-counts.mjs export.json public/counts.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Keepalive commit (avoid the 60-day scheduled-workflow disable)
        if: ${{ !github.event.repository.fork }}
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
      # Last on purpose: the counts are already published. A failed run is how the owner is told (GitHub emails failed runs;
      # the Workers Free plan has no usage notifications). The usage numbers are never written to counts.json.
      - name: Fail the run when Worker usage is over 70% of its daily limits
        run: node scripts/check-usage.mjs export.json
